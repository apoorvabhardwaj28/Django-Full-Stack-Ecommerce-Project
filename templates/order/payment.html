{% extends "base.html" %}

{% block title %}Payment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="page-card p-5 text-center">
            <h2 class="mb-3">Complete Payment</h2>
            <p class="text-muted mb-2">Secure checkout powered by Razorpay</p>
            <h4 class="mb-4">Total Amount: ₹{{ total_amount }}</h4>

            <button id="rzp-button1" class="btn btn-dark btn-lg px-4">
                Pay Now
            </button>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ payment.amount }}",
    "currency": "INR",
    "name": "MyStore",
    "description": "Order Payment",
    "order_id": "{{ payment.id }}",
    "handler": function (response) {
        window.location.href = "{% url 'payment_success' %}";
    },
    "theme": {
        "color": "#111827"
    }
};

var rzp1 = new Razorpay(options);

document.getElementById('rzp-button1').onclick = function(e) {
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
