<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Address | MyStore</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
            min-height: 100vh;
            padding: 24px;
            color: #111827;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 30px;
        }

        .top-bar p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 20px;
        }

        .checkbox-row input[type="checkbox"] {
            width: auto;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-dark {
            background: #111827;
            color: #fff;
        }

        .btn-dark:hover {
            background: #1f2937;
        }

        .btn-light {
            background: #fff;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        .btn-light:hover {
            background: #f9fafb;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }

            .top-bar h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>
                <h1>Edit Address</h1>
                <p>Update your saved delivery details</p>
            </div>
            <a href="{% url 'profile' %}" class="btn btn-light">Back to Profile</a>
        </div>

        <div class="card">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-grid">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" name="full_name" id="full_name" value="{{ address.full_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" name="phone" id="phone" value="{{ address.phone }}" required>
                    </div>

                    <div class="form-group full">
                        <label for="address_line_1">Address Line 1</label>
                        <input type="text" name="address_line_1" id="address_line_1" value="{{ address.address_line_1 }}" required>
                    </div>

                    <div class="form-group full">
                        <label for="address_line_2">Address Line 2</label>
                        <input type="text" name="address_line_2" id="address_line_2" value="{{ address.address_line_2|default:'' }}">
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" name="city" id="city" value="{{ address.city }}" required>
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" name="state" id="state" value="{{ address.state }}" required>
                    </div>

                    <div class="form-group">
                        <label for="postal_code">Postal Code</label>
                        <input type="text" name="postal_code" id="postal_code" value="{{ address.postal_code }}" required>
                    </div>

                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" name="country" id="country" value="{{ address.country }}" required>
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" name="is_default" id="is_default" {% if address.is_default %}checked{% endif %}>
                    <label for="is_default" style="margin: 0; font-weight: 500;">Set as default address</label>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-dark">Update Address</button>
                    <a href="{% url 'profile' %}" class="btn btn-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
